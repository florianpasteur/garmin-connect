name: Release Package

on:
    push:
        branches:
            - main
        # Prevent triggering on tag pushes
        tags-ignore:
            - 'v*'

permissions:
    contents: write
    packages: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest

        # Skip if the commit message contains 'chore(release)'
        if: "!contains(github.event.head_commit.message, 'chore(release)')"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # needed to push tags

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/

            - name: Install dependencies
              run: npm ci

            # A version in package.json without a tag was set by hand (a minor
            # or major release): publish it as is. Otherwise bump the patch.
            - name: Set release version
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  version=$(node -p "require('./package.json').version")
                  if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                      npm version patch -m "chore(release): bump version to %s"
                  else
                      git tag -a "v$version" -m "chore(release): version $version"
                  fi

            - name: Build package
              run: npm run build

            - name: Push changes and tags
              run: |
                  git push origin main
                  git push origin --tags

            - name: Github check
              run: echo $GITHUB_REPOSITORY

            - name: Publish to npm
              run: npm publish --provenance --access public
