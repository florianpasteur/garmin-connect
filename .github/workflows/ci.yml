name: CI

on:
    pull_request:

permissions:
    contents: read

# A new push to a pull request replaces the run of the previous one
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx --no-install prettier --check .

            - name: Build package
              run: npm run build

            - name: Run integration tests
              run: npm test

            # The tests against real Garmin Connect stay skipped (no account in
            # CI). This only makes sure that every one of them still loads.
            - name: Load live tests
              run: npm run test:live

            - name: Check example syntax
              run: for file in examples/*.js; do node --check "$file"; done
